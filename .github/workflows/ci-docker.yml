name: Docker CI

on:
  pull_request:
    branches: ['main']
    paths:
      - '**/*.go'
      - '**/go.*'
      - '.github/workflows/ci-docker.yml'
      - '.github/workflows/publish.yml'
      - 'Dockerfile'
      - 'Makefile'

env:
  GHCR_IMAGE_NAME: ghcr.io/blinklabs-io/handshake-node

permissions:
  contents: read

jobs:
  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: '0'
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0 https://github.com/docker/setup-buildx-action/releases/tag/v4.2.0
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: ${{ env.GHCR_IMAGE_NAME }}
      - name: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0 https://github.com/docker/build-push-action/releases/tag/v7.3.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/${{ matrix.arch }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            handshake-node:ci-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
            COMMIT_HASH=${{ github.sha }}
      - name: smoke test image defaults
        run: |
          data_volume="handshake-node-ci-data-${GITHUB_RUN_ID}-${{ matrix.arch }}"
          legacy_volume="handshake-node-ci-legacy-${GITHUB_RUN_ID}-${{ matrix.arch }}"
          cleanup() {
            docker volume rm -f "${data_volume}" "${legacy_volume}" \
              >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --rm --platform linux/${{ matrix.arch }} \
            handshake-node:ci-${{ matrix.arch }} --version
          docker run --rm --platform linux/${{ matrix.arch }} \
            --entrypoint /bin/sh handshake-node:ci-${{ matrix.arch }} -ec '
              test "$(id -u)" -eq 100
              test "$(id -g)" -eq 101
              test "$HOME" = /home/handshake
              test "$PWD" = /data
              test "$(readlink /home/handshake/.handshake-node)" = /data
              test ! -e /data/handshake-node.conf
              touch /data/.write-test
              rm /data/.write-test
            '
          docker volume create "${data_volume}" >/dev/null
          docker run --rm --platform linux/${{ matrix.arch }} \
            --mount "type=volume,src=${data_volume},dst=/data" \
            --entrypoint /bin/sh handshake-node:ci-${{ matrix.arch }} -ec '
              test "$(id -u)" -eq 100
              test "$(id -g)" -eq 101
              test "$HOME" = /home/handshake
              test "$PWD" = /data
              test "$(readlink /home/handshake/.handshake-node)" = /data
              test "$(stat -c "%u:%g" /data)" = 100:101
              test ! -e /data/handshake-node.conf
              touch /data/.write-test
              test "$(stat -c "%u:%g" /data/.write-test)" = 100:101
              test -e /home/handshake/.handshake-node/.write-test
              rm /data/.write-test
            '
          docker volume create "${legacy_volume}" >/dev/null
          docker run --rm --platform linux/${{ matrix.arch }} \
            --mount \
              "type=volume,src=${legacy_volume},dst=/home/handshake/.handshake-node" \
            --entrypoint /bin/sh handshake-node:ci-${{ matrix.arch }} -ec '
              test "$(id -u)" -eq 100
              test "$(id -g)" -eq 101
              test "$HOME" = /home/handshake
              test "$PWD" = /data
              test "$(readlink /home/handshake/.handshake-node)" = /data
              test "$(stat -c "%u:%g" /data)" = 100:101
              test ! -e /data/handshake-node.conf
              test ! -e /home/handshake/.handshake-node/handshake-node.conf
              touch /data/.write-test
              touch /home/handshake/.handshake-node/.legacy-write-test
              test "$(stat -c "%u:%g" /data/.write-test)" = 100:101
              test "$(stat -c "%u:%g" \
                /home/handshake/.handshake-node/.legacy-write-test)" = 100:101
              test -e /data/.legacy-write-test
              rm /data/.write-test
              rm /home/handshake/.handshake-node/.legacy-write-test
            '
          output="$(docker run --rm --platform linux/${{ matrix.arch }} \
            -e HANDSHAKE_NODE_DEBUGLEVEL=show \
            handshake-node:ci-${{ matrix.arch }} 2>&1)"
          printf '%s\n' "${output}"
          grep -q 'Supported subsystems' <<<"${output}"
          if grep -Eqi 'config file|handshake-node.conf' <<<"${output}"; then
            exit 1
          fi
          startup_output="$(docker run --rm \
            --platform linux/${{ matrix.arch }} \
            -e GOMAXPROCS=2 \
            handshake-node:ci-${{ matrix.arch }} --dropaddrindex 2>&1)"
          printf '%s\n' "${startup_output}"
          grep -Fq 'maxprocs: Honoring GOMAXPROCS="2"' \
            <<<"${startup_output}"
          grep -q 'RPC service is disabled' <<<"${startup_output}"
          quota_output="$(docker run --rm \
            --platform linux/${{ matrix.arch }} \
            --cpus=2 \
            --entrypoint /bin/sh \
            handshake-node:ci-${{ matrix.arch }} -ec \
            'unset GOMAXPROCS; exec /bin/handshake-node --dropaddrindex' 2>&1)"
          printf '%s\n' "${quota_output}"
          grep -Fq \
            'maxprocs: Updating GOMAXPROCS=2: determined from CPU quota' \
            <<<"${quota_output}"
      - name: scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 https://github.com/aquasecurity/trivy-action/releases/tag/v0.36.0
        with:
          version: v0.72.0
          image-ref: handshake-node:ci-${{ matrix.arch }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
