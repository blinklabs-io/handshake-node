name: go-test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: 1.26.5

jobs:
  cross-platform-build:
    name: build (${{ matrix.os }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            hnsutil/go.sum
      - name: build release binaries
        shell: bash
        run: |
          output_dir="$PWD/dist/${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "${output_dir}"
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} GOBIN="${output_dir}" make release-install
          extension=
          if [[ "${{ matrix.os }}" == windows ]]; then
            extension=.exe
          fi
          for binary in handshake-node hnsctl; do
            test -x "${output_dir}/${binary}${extension}" || [[ "${{ matrix.os }}" == windows && -f "${output_dir}/${binary}${extension}" ]]
            metadata="$(go version -m "${output_dir}/${binary}${extension}")"
            grep -Fq $'build\tvcs.revision=${{ github.sha }}' <<< "${metadata}"
            grep -Fq $'build\tvcs.modified=false' <<< "${metadata}"
          done

  vulnerability:
    name: vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            hnsutil/go.sum
      - name: vulnerability scan
        run: make vuln

  unit-cover:
    name: unit-cover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            hnsutil/go.sum
      - name: test
        run: make unit-cover
      - name: Send top-level coverage
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2 https://github.com/coverallsapp/github-action/releases/tag/v2
        continue-on-error: true
        with:
          file: coverage.txt
          flag-name: handshake-node
          format: golang
          parallel: true
      - name: Send hnsutil coverage
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2 https://github.com/coverallsapp/github-action/releases/tag/v2
        continue-on-error: true
        with:
          file: hnsutil/coverage.txt
          flag-name: hnsutil
          format: golang
          parallel: true
      - name: Notify coveralls all reports sent
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2 https://github.com/coverallsapp/github-action/releases/tag/v2
        continue-on-error: true
        with:
          parallel-finished: true

  unit-race:
    name: unit-race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            hnsutil/go.sum
      - name: test
        run: make unit-race

  rpc-integration:
    name: rpc-integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            hnsutil/go.sum
      - name: tagged integration tests
        run: make integration
