name: hsd-interop

on:
  push:
    branches:
      - main
    tags:
      - v*
    paths:
      - '**/*.go'
      - '**/go.*'
      - 'Makefile'
      - '.github/workflows/hsd-interop.yml'

permissions:
  contents: read

env:
  GO_VERSION: 1.26.5

jobs:
  hsd-interop:
    name: hsd-interop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          repository: handshake-org/hsd
          ref: 9f013c1cb7f92edf94db69fbd69daf34adf655fb
          path: .hsd
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 https://github.com/actions/setup-node/releases/tag/v6.4.0
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: .hsd/package-lock.json
      - name: install pinned hsd dependencies
        working-directory: .hsd
        run: npm ci
      - name: live pinned-hsd interoperability tests
        env:
          HSD_DIR: ${{ github.workspace }}/.hsd
        run: make hsd-interop
