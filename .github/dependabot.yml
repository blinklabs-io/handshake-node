version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directories:
      - /
      - /hnsutil
      - /chaincfg/chainhash
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns:
          - "*"
        group-by: dependency-name
